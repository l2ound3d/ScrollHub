<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScrollHub</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header id="chrome" class="chrome">
        <div class="chrome-left">
          <button id="menu-toggle" class="icon-btn" type="button" title="Menu (M)" aria-label="Open menu">☰</button>
          <div class="chrome-meta">
            <span id="comic-title" class="comic-title">ScrollHub</span>
            <span id="page-info-wrap" class="page-info-wrap" hidden>
              <button id="page-info-btn" class="page-info-btn" type="button" title="Click to jump to page"></button>
              <input
                id="page-jump-input"
                class="page-jump-input"
                type="number"
                min="1"
                hidden
                aria-label="Jump to page number"
              />
            </span>
            <input
              id="page-slider"
              class="page-slider"
              type="range"
              min="0"
              max="0"
              value="0"
              hidden
              aria-label="Jump to page"
            />
          </div>
        </div>
        <div class="chrome-actions">
          <button id="open-file-btn" class="icon-btn" type="button" title="Open CBZ">📂</button>
          <button id="prev-page-btn" class="icon-btn" type="button" title="Previous page">‹</button>
          <button id="next-page-btn" class="icon-btn" type="button" title="Next page">›</button>
          <button id="chrome-toggle" class="icon-btn" type="button" title="Hide UI (H)">▴</button>
        </div>
      </header>

      <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
      <aside id="drawer" class="drawer" hidden aria-label="Navigation menu">
        <div class="drawer-header">
          <span>Menu</span>
          <button id="drawer-close" class="icon-btn" type="button" aria-label="Close menu">✕</button>
        </div>
        <nav class="drawer-nav">
          <button class="nav-btn active" data-view="reader" type="button">Reader</button>
          <button class="nav-btn" data-view="library" type="button">Library</button>
          <button class="nav-btn" data-view="settings" type="button">Settings</button>
        </nav>
        <div class="drawer-actions">
          <button id="open-folder-btn" class="secondary-btn" type="button">Open Folder</button>
        </div>
        <p class="drawer-hint">H hide UI · M menu · ← → pages</p>
      </aside>

      <main class="content">
        <section id="reader-view" class="view-panel">
          <div id="empty-state" class="empty-state">
            <p class="empty-title">Open a comic</p>
            <p class="empty-sub">Use the folder button or drag a .cbz here</p>
          </div>
          <div id="page-container" class="page-container"></div>
        </section>

        <section id="library-view" class="view-panel" hidden>
          <div class="panel-header library-header">
            <h3>Library</h3>
            <div id="library-breadcrumb" class="library-breadcrumb"></div>
          </div>
          <p id="library-empty" class="inline-empty" hidden>
            No folders found here.
          </p>
          <div id="library-list" class="library-list"></div>
        </section>

        <section id="settings-view" class="view-panel" hidden>
          <div class="panel-header">
            <h3>Settings</h3>
          </div>
          <form id="settings-form" class="settings-form">
            <label>
              Theme
              <select id="theme-select">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
            <label>
              Reading direction
              <select id="direction-select">
                <option value="ltr">Left to right</option>
                <option value="rtl">Right to left</option>
              </select>
            </label>
            <label>
              Reading mode
              <select id="mode-select">
                <option value="single">Single page</option>
                <option value="double">Double page</option>
                <option value="webtoon">Webtoon (scroll)</option>
              </select>
            </label>
            <label>
              Fit mode
              <select id="fit-select">
                <option value="width">Fit width</option>
                <option value="height">Fit height</option>
                <option value="original">Original size</option>
              </select>
            </label>
            <label>
              Library folder
              <div class="input-row">
                <input id="library-folder" type="text" readonly placeholder="No folder selected" />
                <button type="button" id="browse-library-folder" class="secondary-btn">Browse</button>
              </div>
            </label>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
