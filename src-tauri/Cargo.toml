[package]
name = "scrollhub"
version = "0.1.2"
description = "ScrollHub — a lightweight CBZ comic reader"
authors = ["you"]
edition = "2021"

[lib]
name = "scrollhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
base64 = "0.22"
natord = "1.0.9"
smb2 = "0.11"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-fs = "28.1.0"
